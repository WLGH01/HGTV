name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build phone and TV debug APKs
        working-directory: android
        run: gradle :app:assemblePhoneDebug :app:assembleTvDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/phone/debug/app-phone-debug.apk out/HGTV-phone-debug.apk
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk out/HGTV-tv-debug.apk
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HGTV-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
