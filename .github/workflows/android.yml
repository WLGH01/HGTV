name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build phone and TV debug APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assemblePhoneDebug :app:assembleTvDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Build log
          body: "最近一次失败构建的 Gradle 日志"
          files: android/build.log
          overwrite_files: true

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/phone/debug/app-phone-debug.apk out/HGTV-phone-debug.apk
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk out/HGTV-tv-debug.apk
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HGTV-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish latest APKs to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HGTV latest build
          body: |
            自动构建（commit `${{ github.sha }}`）

            - 手机原生版：`HGTV-phone-debug.apk`
            - Android TV 原生版：`HGTV-tv-debug.apk`
            - 播放器支持 0.5x–2.0x 倍速
          files: out/*.apk
          make_latest: true
          overwrite_files: true

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
