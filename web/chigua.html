<script src="app.js?v=20261123a"></script>
<script>
const $ = (s) => document.querySelector(s);
const POST_ID = new URLSearchParams(location.search).get('post') || '';
const STATE = { cate: 'all', page: 0, pages: 1, total: 0, loading: false };
const LABEL = { all: '全部吃瓜', remen: '热门吃瓜', yuanchuang: 'AI原创' };

async function loadPage(reset) {
  if (STATE.loading) return;
  if (!reset && STATE.page >= STATE.pages) return;
  STATE.loading = true;
  const grid = $('#grid');
  setStatus($('#status'), '加载中…');
  try {
    const next = reset ? 1 : STATE.page + 1;
    const d = await api('/chigua?cate=' + STATE.cate + '&page=' + next + '&size=' + PAGE_SIZE);
    const list = d.list || [];
    STATE.page = d.page || next;
    STATE.pages = d.pagecount || 1;
    STATE.total = d.total || list.length;
    if (reset) grid.innerHTML = '';
    grid.insertAdjacentHTML('beforeend', gridHtml(list));
    bindCards(grid);
    setStatus($('#status'), `已显示 ${grid.querySelectorAll('.card').length} 条 · 第 ${STATE.page}/${STATE.pages} 页`);
    $('#load-more').innerHTML = STATE.page >= STATE.pages ? '<div class="done">已加载全部内容</div>' : '<button id="more">加载更多（50 条）</button>';
    const more = $('#more');
    if (more) more.onclick = () => loadPage(false);
  } catch (e) {
    setStatus($('#status'), '加载失败，请稍后重试。');
  } finally {
    STATE.loading = false;
  }
}
function reset() { STATE.page = 0; STATE.pages = 1; loadPage(true); }

// 吃瓜正文：源站返回 HTML，图片同样是 AES 密文。
// 清洗掉脚本/事件属性，再把 img 改成 data-src 交给 app.js 解密。
function sanitizeContent(html) {
  const doc = new DOMParser().parseFromString('<div id="__hg_root">' + (html || '') + '</div>', 'text/html');
  const root = doc.getElementById('__hg_root');
  if (!root) return '';
  root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button').forEach((n) => n.remove());
  root.querySelectorAll('*').forEach((n) => {
    Array.from(n.attributes).forEach((a) => {
      const name = a.name.toLowerCase();
      if (name.indexOf('on') === 0) n.removeAttribute(a.name);
      else if ((name === 'href' || name === 'src' || name === 'srcset') && /^\s*(javascript|data:text\/html)/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
  root.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src') || img.getAttribute('data-src');
    if (src) img.setAttribute('data-src', src);
    img.removeAttribute('src');
    img.removeAttribute('srcset');
    img.setAttribute('loading', 'lazy');
  });
  root.querySelectorAll('a').forEach((a) => { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noreferrer'); });
  return root.innerHTML;
}

async function renderPost(id) {
  $('#chigua-tabs').innerHTML = '';
  $('#load-more').innerHTML = '';
  $('#heading').textContent = '吃瓜详情';
  setStatus($('#status'), '正在加载吃瓜详情…');
  try {
    const d = await api('/post/' + encodeURIComponent(id));
    const p = (d.list || [])[0];
    if (!p) throw Error('详情为空');
    document.title = p.vod_name + ' · 黄果吃瓜';
    const cover = p.vod_pic ? '<div class="post-cover">' + imgTag(p.vod_pic, p.vod_name) + '</div>' : '';
    $('#grid').classList.remove('grid');
    $('#grid').innerHTML = '<article class="post-detail">'
      + '<a class="post-back" href="chigua.html">← 返回吃瓜列表</a>'
      + '<h2>' + esc(p.vod_name) + '</h2>'
      + '<div class="post-meta">' + esc(p.vod_author || '黄果吃瓜') + (p.vod_created ? ' · ' + esc(p.vod_created) : '') + '</div>'
      + cover
      + '<div class="post-content">' + sanitizeContent(p.vod_content) + '</div>'
      + '<p class="post-src"><a href="' + SITE + '/archives/' + encodeURIComponent(p.vod_post_id) + '/" target="_blank" rel="noreferrer">查看源站原文 ↗</a></p>'
      + '</article>';
    setStatus($('#status'), '');
    hydrateCovers($('#grid'));
  } catch (e) {
    setStatus($('#status'), '吃瓜详情读取失败：' + String(e.message || e));
  }
}

window.addEventListener('scroll', () => {
  if (POST_ID) return;
  if (STATE.loading || STATE.page >= STATE.pages) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 700) loadPage(false);
});

if (POST_ID) {
  renderPost(POST_ID);
} else {
  chips($('#chigua-tabs'), CHIGUA_TABS, STATE.cate, (v) => { STATE.cate = v; $('#heading').textContent = LABEL[v] || v; reset(); });
  reset();
}
</script>
</body>
