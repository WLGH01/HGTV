<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const SLUG = params.get('slug') || '';
const NAME = params.get('name') || SLUG;
const STATE = { page: 0, pages: 1, total: 0, loading: false };
$('#title').textContent = '# ' + NAME;
document.title = NAME + ' · 标签 · 黄果解析';

async function loadPage(reset) {
  if (!SLUG) {
    setStatus($('#status'), '缺少标签参数');
    return;
  }
  if (STATE.loading) return;
  if (!reset && STATE.page >= STATE.pages) return;
  STATE.loading = true;
  const next = reset ? 1 : STATE.page + 1;
  const base = SITE + '/tag/' + encodeURIComponent(SLUG) + '/';
  const url = next > 1 ? base + 'page/' + next + '/' : base;
  setStatus($('#status'), '加载中…');
  try {
    const html = await fetchHtml(url);
    const list = parseHtmlCards(html);
    const nums = [...html.matchAll(/\/tag\/[^/]+\/page\/(\d+)\//g)].map((m) => Number(m[1]));
    STATE.pages = nums.length ? Math.max.apply(null, nums) : 1;
    STATE.page = next;
    STATE.total = list.length;
    if (reset) $('#grid').innerHTML = '';
    $('#grid').insertAdjacentHTML('beforeend', gridHtml(list));
    bindCards($('#grid'));
    hydrateCovers($('#grid'));
    setStatus($('#status'), `已显示 ${$('#grid').querySelectorAll('.card').length} 部 · 第 ${STATE.page}/${STATE.pages} 页`);
    $('#load-more').innerHTML = STATE.page >= STATE.pages
      ? '<div class="done">已加载全部内容</div>'
      : '<button id="more">加载更多</button>';
    const more = $('#more');
    if (more) more.onclick = () => loadPage(false);
  } catch (e) {
    setStatus($('#status'), '加载失败：' + e.message);
  } finally {
    STATE.loading = false;
  }
}
loadPage(true);
</script>
