<script src="app.js?v=20261123d"></script>
<script>
const $ = (s) => document.querySelector(s);
const STATE = { page: 0, pages: 1, total: 0, loading: false };
async function loadPage(reset) {
  if (STATE.loading) return;
  if (!reset && STATE.page >= STATE.pages) return;
  STATE.loading = true;
  const next = reset ? 1 : STATE.page + 1;
  setStatus($('#status'), '加载中…');
  try {
    const d = await api('/videos?page=' + next + '&size=50&is_original=1');
    const list = d.list || [];
    STATE.page = d.page || next;
    STATE.pages = d.pagecount || 1;
    STATE.total = d.total || list.length;
    if (reset) $('#grid').innerHTML = '';
    $('#grid').insertAdjacentHTML('beforeend', gridHtml(list));
    bindCards($('#grid'));
    hydrateCovers($('#grid'));
    setStatus($('#status'), `共 ${STATE.total} 部 · 已显示 ${$('#grid').querySelectorAll('.card').length} 部 · 第 ${STATE.page}/${STATE.pages} 页`);
    $('#load-more').innerHTML = STATE.page >= STATE.pages
      ? '<div class="done">已加载全部内容</div>'
      : '<button id="more">加载更多</button>';
    const more = $('#more');
    if (more) more.onclick = () => loadPage(false);
  } catch (e) {
    setStatus($('#status'), '加载失败：' + e.message);
  } finally {
    STATE.loading = false;
  }
}
loadPage(true);
</script>
