<script src="app.js?v=20261123d"></script>
<script>
const $ = (s) => document.querySelector(s);
function renderRow(sel, list) {
  const el = $(sel);
  if (!el) return;
  el.innerHTML = (list || []).map(cardHtml).join('') || '<div class="empty">暂无内容</div>';
  bindCards(el);
  hydrateCovers(el);
}
async function safe(fn, fallback) {
  try { return await fn(); } catch (e) { return fallback; }
}
async function loadHome() {
  setStatus($('#home-status'), '正在加载首页…');
  const featured = await safe(async () => parseHtmlCards(await fetchHtml(SITE + '/recommend')).slice(0, 12), []);
  const latest = await safe(async () => (await api('/category/ai-duanju?page=1&size=12&sort=latest')).list || [], []);
  const original = await safe(async () => (await api('/videos?page=1&size=12&is_original=1')).list || [], []);
  const hot = await safe(async () => (await api('/category/ai-duanju?page=1&size=12&sort=hot')).list || [], []);
  const topics = await safe(async () => (await api('/topics')).list || [], []);
  const tagData = await safe(async () => (await fetch(SITE + '/api/tags')).json(), null);

  renderRow('#row-featured', featured);
  renderRow('#row-latest', latest);
  renderRow('#row-original', original);
  renderRow('#row-hot', hot);

  const tagEl = $('#home-tags');
  const tags = tagData && tagData.data && tagData.data.categories
    ? tagData.data.categories.flatMap((c) => c.tags || []).slice(0, 30)
    : [];
  tagEl.innerHTML = tags.map((t) => `<button onclick="location.href='tag.html?slug=${encodeURIComponent(t.slug)}&name=${encodeURIComponent(t.name)}'">${esc(t.name)}</button>`).join('') || '<span class="muted">暂无标签</span>';

  renderRow('#row-topics', (topics || []).map((t) => ({
    vod_id: 'topic_' + t.slug,
    vod_name: t.title,
    vod_pic: mediaUrl(t.cover || ''),
    vod_remarks: (t.video_count || 0) + ' 部'
  })));

  const total = featured.length + latest.length + original.length + hot.length;
  setStatus($('#home-status'), total ? '' : '内容加载失败，请稍后重试。');
}
loadHome();
</script>
</body>
